def reactNativeArchitectures() {
    def value = rootProject.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") &&
        rootProject.getProperty("newArchEnabled") == "true"
}

def getExtOrDefault(name) {
    return rootProject.ext.has(name)
        ? rootProject.ext.get(name)
        : project.properties["LottieNitro_" + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name)
        ? rootProject.ext.get(name)
        : (project.properties["LottieNitro_" + name]).toInteger()
}

def isBuiltInKotlinEnabled() {
    def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
    if (agpMajorVersion < 9) {
        return false
    }
    def builtInKotlinProperty = project.findProperty("android.builtInKotlin")
    return builtInKotlinProperty == null || builtInKotlinProperty.toString().toBoolean()
}

apply plugin: "com.android.library"

if (!isBuiltInKotlinEnabled()) {
    apply plugin: "org.jetbrains.kotlin.android"
}

apply from: "../nitrogen/generated/android/LottieNitro+autolinking.gradle"

android {
    namespace "com.margelo.nitro.lottienitro"

    ndkVersion getExtOrDefault("ndkVersion")
    compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault("minSdkVersion")
        targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                abiFilters(*reactNativeArchitectures())
                buildTypes {
                    debug { cppFlags "-O1 -g" }
                    release { cppFlags "-O2" }
                }
            }
        }
    }

    externalNativeBuild {
        cmake { path "CMakeLists.txt" }
    }

    buildFeatures {
        buildConfig true
        prefab true
    }

    packagingOptions {
        excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so",
        ]
    }

    buildTypes {
        release { minifyEnabled false }
    }

    lintOptions { disable "GradleCompatible" }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-native:+"
    implementation "com.airbnb.android:lottie:6.7.1"
    implementation project(":react-native-nitro-modules")
}
