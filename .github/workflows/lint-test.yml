name: Setup & Lint Package

on:
  pull_request:
    branches:
      - master

# Only run on the latest workflow run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-and-lint-package:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn setup

      - name: Compile TypeScript for Example Project
        run: yarn tsc

      - name: SwiftLint
        run: yarn lint:swift

      - name: Check Package.swift matches the podspec
        run: yarn lint:spm-parity

      # --- lottie-react-native-nitro (v8, not yet the default) ---

      - name: Compile TypeScript for Nitro Package
        run: yarn nitro:tsc:lib

      - name: Compile TypeScript for Nitro Example
        run: yarn nitro:tsc

      # `packages/nitro/nitrogen/generated` is committed, because the podspec,
      # build.gradle, CMakeLists and the view wrapper all reference generated
      # artifacts — a fresh clone cannot even `pod install` without them. Nothing
      # otherwise verifies that output still matches `LottieView.nitro.ts`, so
      # regenerate and fail on any diff.
      - name: Check Nitro codegen is up to date
        run: |
          yarn nitro:codegen
          git diff --exit-code -- packages/nitro/nitrogen

      - name: SwiftLint Nitro Package
        run: yarn nitro:lint:swift
