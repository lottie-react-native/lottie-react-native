name: Setup & Lint Package

on:
  pull_request:
    branches:
      - master

# Only run on the latest workflow run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-and-lint-package:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install Dependencies
        run: yarn install --immutable

      # --- lottie-react-native (v8, the published package) ---

      - name: Build project
        run: yarn setup

      - name: Compile TypeScript for Package
        run: yarn tsc:lib

      - name: Compile TypeScript for Example Project
        run: yarn tsc

      # `packages/nitro/nitrogen/generated` is committed, because the podspec,
      # build.gradle, CMakeLists and the view wrapper all reference generated
      # artifacts — a fresh clone cannot even `pod install` without them. Nothing
      # otherwise verifies that output still matches `LottieView.nitro.ts`, so
      # regenerate and fail on any diff.
      #
      # `yarn codegen` also re-vendors the generated view config into `src/views`,
      # which is what makes it reachable from both `src` and the built `lib` — so
      # that copy is covered by the same drift check.
      - name: Check codegen is up to date
        run: |
          yarn codegen
          git diff --exit-code -- packages/nitro/nitrogen packages/nitro/src/views/LottieViewConfig.json

      - name: SwiftLint
        run: yarn lint:swift

      # --- lottie-react-native-v7 (7.x maintenance, private, not published from master) ---

      - name: Build v7 project
        run: yarn v7:setup

      - name: Compile TypeScript for v7 Example Project
        run: yarn v7:tsc

      - name: SwiftLint v7
        run: yarn v7:lint:swift

      - name: Check v7 Package.swift matches the podspec
        run: yarn v7:lint:spm-parity
